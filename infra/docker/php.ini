; SIGAP production PHP settings
expose_php = Off
memory_limit = 256M
; Excel imports and photos (the PWA compresses photos to ≤ 300 KB, imports are ≤ 10 MB)
upload_max_filesize = 12M
post_max_size = 14M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code only changes with a new image
opcache.validate_timestamps = 0
